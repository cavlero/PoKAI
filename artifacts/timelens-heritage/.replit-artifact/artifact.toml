kind = "web"
previewPath = "/"
title = "TimeLens Heritage"
version = "1.0.0"
id = "artifacts/timelens-heritage"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22211

[services.development]
run = "pnpm --filter @workspace/timelens-heritage run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/timelens-heritage", "run", "build" ]
publicDir = "artifacts/timelens-heritage/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22211"
BASE_PATH = "/"
